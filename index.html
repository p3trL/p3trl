<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discipline Flow</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --accent-green: #22c55e;
            --today-bright: #4ade80; --accent-red: #ef4444; 
            --border: #334155; --selected-border: #ffd700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Urbanist', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); color: var(--text-main); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden;
        }

        #bgCloseLayer { position: fixed; inset: 0; z-index: 1; display: none; }
        .panel-open #bgCloseLayer { display: block; }

        .wrapper { 
            display: flex; align-items: center; justify-content: center; 
            width: 100%; max-width: 1200px; padding: 20px; z-index: 10;
            position: relative;
        }

        .dashboard { 
            flex: 0 1 800px; background: var(--card-bg); padding: 40px; border-radius: 24px; 
            border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
            width: 100%; position: relative; z-index: 5; transition: all 0.4s ease;
        }

        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; transition: opacity 0.3s; }
        .user-info h1 { font-size: 28px; font-weight: 700; color: var(--text-main); }
        .auth-link { color: var(--text-muted); cursor: pointer; font-size: 13px; margin-top: 5px; background: none; border: none; padding: 0; text-align: left; }

        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; transition: all 0.4s ease; }

        .cell { 
            aspect-ratio: 1 / 0.85; background: rgba(255,255,255,0.03); 
            border: 2px solid var(--border); border-radius: 16px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; font-weight: 700; cursor: pointer; transition: 0.2s; 
        }

        .cell.marked { background: rgba(34, 197, 94, 0.2) !important; color: var(--accent-green) !important; border-color: var(--accent-green) !important; }
        .cell.today-is { border-color: #ffffff !important; border-width: 3px; }
        .cell.today-unmarked { background: var(--today-bright) !important; color: #0f172a !important; }
        .cell.missed { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border-color: var(--accent-red); }
        .cell.inactive { opacity: 0.3; cursor: default; pointer-events: none; }
        .cell.selected { border-color: var(--selected-border) !important; border-width: 4px !important; transform: scale(1.05); }

        /* Панель (Desktop) */
        .side-panel { 
            width: 0; opacity: 0; overflow: hidden; height: 100%;
            background: var(--card-bg); border-radius: 24px; border: 1px solid var(--border); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            position: relative;
        }

        .wrapper.panel-open .side-panel { width: 320px; padding: 30px; opacity: 1; margin-left: 30px; }
        .panel-btn { color: white; border: none; padding: 18px 30px; border-radius: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .fix-btn { background: var(--accent-green); }
        .cancel-btn { background: var(--accent-red); }
        .hidden { display: none !important; }

        /* МОБИЛЬНАЯ АДАПТАЦИЯ (ЗАМЕЩЕНИЕ) */
        @media (max-width: 768px) {
            .dashboard { padding: 25px; min-height: 450px; display: flex; flex-direction: column; }
            .grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
            
            .wrapper.panel-open .grid, .wrapper.panel-open .header { 
                opacity: 0; pointer-events: none; transform: scale(0.95);
            }

            .side-panel {
                position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
                width: 90% !important; height: auto; opacity: 0; pointer-events: none;
                border: none; background: transparent; z-index: 10;
            }

            .wrapper.panel-open .side-panel {
                opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1);
                margin-left: 0;
            }

            .header { margin-bottom: 20px; }
            .cell { font-size: 20px; }
        }
    </style>
</head>
<body id="bodyRoot">

<div id="bgCloseLayer"></div>

<div class="wrapper" id="mainWrapper">
    <div class="dashboard" id="dashboardCard">
        <div class="header">
            <div class="user-info">
                <h1 id="userDisplay">Юзер</h1>
                <button id="authActionBtn" class="auth-link">Авторизация через Google</button>
            </div>
            <div style="display:flex; gap:10px; align-items:center; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 12px;">
                <button id="prevMonth" style="background:none; border:none; color:white; cursor:pointer; font-size: 20px;">←</button>
                <h2 id="monthYear" style="min-width: 100px; text-align: center; font-size: 14px;">...</h2>
                <button id="nextMonth" style="background:none; border:none; color:white; cursor:pointer; font-size: 20px;">→</button>
            </div>
        </div>
        
        <div class="grid" id="calendarGrid"></div>

        <div class="side-panel" id="sidePanel">
            <div id="panelEmoji" style="font-size: 50px; margin-bottom: 20px;">🤔</div>
            <div id="panelDescription" style="color: var(--text-muted); line-height: 1.5; margin-bottom: 25px; font-size: 18px;">
                Похоже, ты <b id="panelDate" style="color:white">...</b><br>забыл отметить день
            </div>
            <button class="panel-btn fix-btn hidden" id="fixBtn">Я ВСЕ СДЕЛАЛ!</button>
            <button class="panel-btn cancel-btn hidden" id="cancelBtn">ОТМЕНИТЬ НАЖАТИЕ</button>
            <div id="authWarning" style="color:#fbbf24; font-size:12px; margin-top:10px;" class="hidden">Войдите для сохранения</div>
            <button id="closePanelBtn" style="background:none; border:none; color:var(--text-muted); margin-top:15px; cursor:pointer; text-decoration:underline;">Назад к календарю</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBTwHveplqnvmfGhoqfKvtMrhdGG8Hog38",
        authDomain: "calendarpeter-ccb5e.firebaseapp.com",
        projectId: "calendarpeter-ccb5e",
        storageBucket: "calendarpeter-ccb5e.firebasestorage.app",
        messagingSenderId: "941069064655",
        appId: "1:941069064655:web:0af9686c36671cd8f8daba"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const provider = new firebase.auth.GoogleAuthProvider();

    const wrapper = document.getElementById('mainWrapper');
    const grid = document.getElementById('calendarGrid');
    const bgCloseLayer = document.getElementById('bgCloseLayer');
    const userDisplay = document.getElementById('userDisplay');
    const authActionBtn = document.getElementById('authActionBtn');
    
    let activeDate = new Date();
    const realToday = new Date(); realToday.setHours(0,0,0,0);
    const realTodayStr = `${realToday.getFullYear()}-${realToday.getMonth()}-${realToday.getDate()}`;
    let selectedDay = null;

    const closeAll = () => {
        wrapper.classList.remove('panel-open');
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
    };

    bgCloseLayer.onclick = closeAll;
    document.getElementById('closePanelBtn').onclick = closeAll;

    authActionBtn.onclick = () => {
        if (auth.currentUser) auth.signOut();
        else auth.signInWithPopup(provider);
    };

    auth.onAuthStateChanged(user => {
        if (user) {
            userDisplay.innerText = user.displayName;
            authActionBtn.innerText = "Выйти";
            loadData();
        } else {
            userDisplay.innerText = "Юзер";
            authActionBtn.innerText = "Авторизация через Google";
            render({});
        }
    });

    async function loadData() {
        if (auth.currentUser) {
            const doc = await db.collection('users').doc(auth.currentUser.uid).get();
            render(doc.exists ? doc.data() : {});
        } else {
            render({});
        }
    }

    function render(userData) {
        const fragment = document.createDocumentFragment();
        grid.innerHTML = ''; 
        closeAll();
        
        const m = activeDate.getMonth(); const y = activeDate.getFullYear();
        document.getElementById('monthYear').innerText = `${["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"][m]} ${y}`;

        const daysInMonth = new Date(y, m + 1, 0).getDate();
        for (let i = 1; i <= daysInMonth; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell'; cell.innerText = i;
            const dateKey = `${y}-${m}-${i}`;
            const cellDate = new Date(y, m, i); cellDate.setHours(0,0,0,0);

            if (dateKey === realTodayStr) {
                cell.classList.add('today-is');
                if (userData[dateKey] === 'done') cell.classList.add('marked');
                else cell.classList.add('today-unmarked');
            } else if (userData[dateKey] === 'done') {
                cell.classList.add('marked');
            } else if (cellDate < realToday) {
                cell.classList.add('missed');
            } else {
                cell.classList.add('inactive');
            }

            cell.onclick = (e) => {
                e.stopPropagation();
                if (cell.classList.contains('inactive') && cellDate > realToday) return;

                document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                cell.classList.add('selected');
                selectedDay = { key: dateKey, el: cell };
                
                document.getElementById('panelDate').innerText = (dateKey === realTodayStr) ? "сегодня" : `${i}-го числа`;
                document.getElementById('authWarning').classList.toggle('hidden', !!auth.currentUser);

                const isMarked = cell.classList.contains('marked');
                document.getElementById('panelEmoji').innerText = isMarked ? "🙄" : "🤔";
                document.getElementById('panelDescription').classList.toggle('hidden', isMarked);
                document.getElementById('fixBtn').classList.toggle('hidden', isMarked);
                document.getElementById('cancelBtn').classList.toggle('hidden', !isMarked);
                
                wrapper.classList.add('panel-open');
            };
            fragment.appendChild(cell);
        }
        requestAnimationFrame(() => { grid.appendChild(fragment); });
    }

    document.getElementById('fixBtn').onclick = async () => {
        if (!selectedDay) return;
        selectedDay.el.classList.remove('missed', 'today-unmarked', 'selected');
        selectedDay.el.classList.add('marked');
        closeAll();
        if (auth.currentUser) await db.collection('users').doc(auth.currentUser.uid).set({[selectedDay.key]: 'done'}, { merge: true });
    };

    document.getElementById('cancelBtn').onclick = async () => {
        if (!selectedDay) return;
        selectedDay.el.classList.remove('marked', 'selected');
        if (selectedDay.key === realTodayStr) selectedDay.el.classList.add('today-unmarked');
        else selectedDay.el.classList.add('missed');
        closeAll();
        if (auth.currentUser) await db.collection('users').doc(auth.currentUser.uid).set({[selectedDay.key]: firebase.firestore.FieldValue.delete()}, { merge: true });
    };

    document.getElementById('prevMonth').onclick = () => { activeDate.setMonth(activeDate.getMonth() - 1); loadData(); };
    document.getElementById('nextMonth').onclick = () => { activeDate.setMonth(activeDate.getMonth() + 1); loadData(); };
</script>
</body>
</html>
