<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discipline Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --border: #334155;
            --selected-border: #ffd700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Urbanist', sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow-x: hidden;
        }

        /* КОНТЕЙНЕР ДЛЯ ПЛАВНОГО СДВИГА */
        .wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            padding: 20px;
        }

        /* Когда панель открыта, сдвигаем всё */
        .wrapper.panel-open {
            gap: 30px;
        }

        .dashboard {
            flex: 0 1 800px; /* Фиксированная макс. ширина календаря */
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            z-index: 2;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .title-group h1 { font-size: 32px; letter-spacing: -1px; }
        .nav-group { display: flex; align-items: center; gap: 20px; background: rgba(0,0,0,0.2); padding: 10px 20px; border-radius: 12px; border: 1px solid var(--border); }
        .nav-btn { background: transparent; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; }

        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }

        .cell {
            aspect-ratio: 1 / 0.85;
            background: rgba(255,255,255,0.03);
            border: 2px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cell:hover:not(.future) { border-color: var(--accent-blue); background: rgba(255,255,255,0.07); }
        .cell.selected { border-color: var(--selected-border); transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
        .cell.today { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }
        .cell.marked { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border-color: var(--accent-green); }
        .cell.missed { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border-color: var(--accent-red); }
        .cell.future { opacity: 0.3; cursor: default; }

        /* БОКОВАЯ ПАНЕЛЬ С ПЛАВНЫМ ПОЯВЛЕНИЕМ */
        .side-panel {
            width: 0;
            opacity: 0;
            overflow: hidden;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            white-space: nowrap; /* Чтобы текст не переносился криво во время анимации */
        }

        /* Состояние когда панель выезжает */
        .wrapper.panel-open .side-panel {
            width: 320px;
            padding: 30px;
            opacity: 1;
        }

        .panel-icon { font-size: 40px; margin-bottom: 15px; }
        .panel-text { color: var(--text-muted); font-size: 16px; margin-bottom: 25px; line-height: 1.4; }
        
        .fix-btn {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        .fix-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

    </style>
</head>
<body>

<div class="wrapper" id="mainWrapper">
    <div class="dashboard">
        <div class="header">
            <div class="title-group">
                <h1>Дисциплина</h1>
            </div>
            <div class="nav-group">
                <button class="nav-btn" id="prevMonth">←</button>
                <h2 id="monthYear">...</h2>
                <button class="nav-btn" id="nextMonth">→</button>
            </div>
        </div>

        <div class="grid" id="calendarGrid"></div>
    </div>

    <div class="side-panel" id="sidePanel">
        <div class="panel-icon">🤔</div>
        <div class="panel-text">
            Похоже, ты <b id="panelDate">4-го числа</b><br>
            забыл отметить день, лопух
        </div>
        <button class="fix-btn" id="fixBtn">Я ВСЕ СДЕЛАЛ!</button>
    </div>
</div>

<script>
    const wrapper = document.getElementById('mainWrapper');
    const grid = document.getElementById('calendarGrid');
    const monthYear = document.getElementById('monthYear');
    const panelDate = document.getElementById('panelDate');
    const fixBtn = document.getElementById('fixBtn');
    
    let activeDate = new Date();
    const realToday = new Date();
    const realTodayStr = `${realToday.getFullYear()}-${realToday.getMonth()}-${realToday.getDate()}`;
    let selectedDay = null;

    const loadData = () => JSON.parse(localStorage.getItem('habits_v3') || '{}');
    const saveData = (key, val) => {
        const data = loadData();
        data[key] = val;
        localStorage.setItem('habits_v3', JSON.stringify(data));
    };

    function closePanel() {
        wrapper.classList.remove('panel-open');
        const selected = document.querySelector('.cell.selected');
        if (selected) selected.classList.remove('selected');
        selectedDay = null;
    }

    function render() {
        closePanel();
        grid.innerHTML = '';
        const m = activeDate.getMonth();
        const y = activeDate.getFullYear();
        const names = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        monthYear.innerText = `${names[m]} ${y}`;

        const lastDay = new Date(y, m + 1, 0).getDate();
        const data = loadData();

        for (let i = 1; i <= lastDay; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = i;
            const dateKey = `${y}-${m}-${i}`;
            const cellDate = new Date(y, m, i);

            if (dateKey === realTodayStr) {
                cell.classList.add('today');
            } else if (cellDate < realToday) {
                if (data[dateKey] === 'done') cell.classList.add('marked');
                else cell.classList.add('missed');
            } else {
                cell.classList.add('future');
            }

            cell.onclick = () => {
                if (cell.classList.contains('missed')) {
                    const prev = document.querySelector('.cell.selected');
                    if (prev) prev.classList.remove('selected');
                    
                    cell.classList.add('selected');
                    selectedDay = { key: dateKey, el: cell };
                    panelDate.innerText = `${i}-го числа`;
                    wrapper.classList.add('panel-open'); // ПЛАВНЫЙ СДВИГ ТУТ
                } else {
                    closePanel();
                }
            };
            grid.appendChild(cell);
        }
    }

    fixBtn.onclick = () => {
        if (selectedDay) {
            saveData(selectedDay.key, 'done');
            selectedDay.el.classList.remove('missed', 'selected');
            selectedDay.el.classList.add('marked');
            closePanel(); // ВОЗВРАТ В ЦЕНТР ТУТ
        }
    };

    document.getElementById('prevMonth').onclick = () => { activeDate.setMonth(activeDate.getMonth() - 1); render(); };
    document.getElementById('nextMonth').onclick = () => { activeDate.setMonth(activeDate.getMonth() + 1); render(); };

    render();
</script>

</body>
</html>
