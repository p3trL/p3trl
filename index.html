<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Календарь</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; padding: 50px; background-color: #f4f4f9; }
        .calendar { width: 350px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header button { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
        .header button:hover { background: #0056b3; }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; color: #666; margin-bottom: 10px; }
        .days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
        .days div { padding: 12px 0; border-radius: 8px; transition: 0.2s; cursor: pointer; }
        .days div:hover { background: #e9ecef; }
        .today { background: #ff4757 !important; color: white; font-weight: bold; }
        .empty { cursor: default; }
    </style>
</head>
<body>

<div class="calendar">
    <div class="header">
        <button id="prevMonth">&lt;</button>
        <h2 id="monthYear"></h2>
        <button id="nextMonth">&gt;</button>
    </div>
    <div class="weekdays">
        <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div id="days" class="days"></div>
</div>

<script>
    const monthYear = document.getElementById('monthYear');
    const daysContainer = document.getElementById('days');
    let date = new Date();

    function renderCalendar() {
        daysContainer.innerHTML = "";
        const month = date.getMonth();
        const year = date.getFullYear();
        
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        monthYear.innerText = `${monthNames[month]} ${year}`;

        const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
        const lastDay = new Date(year, month + 1, 0).getDate();

        for (let x = 0; x < firstDayIndex; x++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.classList.add('empty');
            daysContainer.appendChild(emptyDiv);
        }

        for (let i = 1; i <= lastDay; i++) {
            const dayDiv = document.createElement('div');
            const isToday = i === new Date().getDate() && month === new Date().getMonth() && year === new Date().getFullYear();
            if (isToday) dayDiv.classList.add('today');
            dayDiv.innerText = i;
            daysContainer.appendChild(dayDiv);
        }
    }

    document.getElementById('prevMonth').onclick = () => { date.setMonth(date.getMonth() - 1); renderCalendar(); };
    document.getElementById('nextMonth').onclick = () => { date.setMonth(date.getMonth() + 1); renderCalendar(); };

    renderCalendar();
</script>

</body>
</html>
