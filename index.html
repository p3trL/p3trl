<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discipline Flow</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --accent-green: #22c55e;
            --today-bright: #4ade80; --accent-red: #ef4444; 
            --border: #334155; --selected-border: #ffd700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Urbanist', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); color: var(--text-main); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; width: 100vw; overflow-x: hidden;
        }

        /* Контейнер: на десктопе всё в ряд */
        .wrapper { 
            display: flex; flex-direction: row; align-items: center; justify-content: center; 
            width: 100%; max-width: 1200px; padding: 20px; transition: gap 0.4s ease; 
            position: relative;
        }
        
        .wrapper.panel-open { gap: 30px; }

        .dashboard { 
            flex: 0 1 750px; background: var(--card-bg); padding: 40px; border-radius: 24px; 
            border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
            position: relative; z-index: 5; transition: filter 0.3s ease, opacity 0.3s ease;
        }

        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }

        .cell { 
            aspect-ratio: 1 / 0.85; background: rgba(255,255,255,0.03); 
            border: 2px solid var(--border); border-radius: 16px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; font-weight: 700; cursor: pointer; transition: 0.2s;
