<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discipline Flow</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --accent-green: #22c55e;
            --today-bright: #4ade80; --accent-red: #ef4444; 
            --border: #334155; --selected-border: #ffd700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Urbanist', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); color: var(--text-main); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; width: 100vw; overflow-x: hidden;
        }

        .wrapper { 
            display: flex; flex-direction: row; align-items: center; justify-content: center; 
            width: 100%; max-width: 1200px; padding: 20px; transition: gap 0.3s; 
        }
        
        .wrapper.panel-open { gap: 30px; }

        .dashboard { 
            flex: 0 1 750px; background: var(--card-bg); padding: 40px; border-radius: 24px; 
            border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
            position: relative; z-index: 5;
        }

        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
        .grid { display: flex; flex-wrap: wrap; gap: 16px; }

        .cell { 
            flex: 0 0 calc((100% - 5 * 16px) / 6);
            aspect-ratio: 1 / 0.85; background: rgba(255,255,255,0.03); 
            border: 2px solid var(--border); border-radius: 16px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; font-weight: 700; cursor: pointer; transition: 0.2s; 
        }

        .cell.marked { background: rgba(34, 197, 94, 0.2) !important; color: var(--accent-green) !important; border-color: var(--accent-green) !important; }
        .cell.today-is { border-color: #ffffff !important; border-width: 3px; }
        .cell.today-unmarked { background: var(--today-bright) !important; color: #0f172a !important; }
        .cell.missed { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border-color: var(--accent-red); }
        .cell.inactive { opacity: 0.3; cursor: default; pointer-events: none; }
        .cell.selected { border-color: var(--selected-border) !important; border-width: 4px !important; transform: scale(1.05); }

        .side-panel { 
            background: var(--card-bg); border-radius: 24px; border: 1px solid var(--border); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            transition: all 0.3s ease;
        }

        @media (min-width: 769px) {
            .side-panel { flex: 0 0 0; width: 0; opacity: 0; overflow: hidden; }
            .wrapper.panel-open .side-panel { flex: 0 0 320px; width: 320px; padding: 30px; opacity: 1; }
        }

        @media (max-width: 768px) {
            .wrapper { flex-direction: column; }
            .wrapper.panel-open .dashboard { opacity: 0.3; pointer-events: none; }

            .side-panel {
                position: fixed; top: 50%; left: 50%; 
                transform: translate(-50%, -50%) scale(0.9);
                width: 85%; max-width: 340px; padding: 30px 20px;
                opacity: 0; pointer-events: none; z-index: 100;
                box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            }

            .wrapper.panel-open .side-panel { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
            .grid { gap: 10px; }
            .cell { flex: 0 0 calc((100% - 3 * 10px) / 4); font-size: 20px; }
            .dashboard { padding: 25px; width: 100%; }
        }

        .grid { align-content: start; }

        .warn-banner {
            display: flex; align-items: center; gap: 8px;
            background: rgba(239,180,68,0.12); border: 1px solid rgba(239,180,68,0.3);
            border-radius: 12px; padding: 10px 14px; margin-bottom: 24px;
            font-size: 13px; color: #fbbf24; line-height: 1.4;
        }
        .warn-banner.hidden { display: none !important; }

        .panel-btn { color: white; border: none; padding: 18px; border-radius: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .fix-btn { background: var(--accent-green); }
        .cancel-btn { background: var(--accent-red); }
        .hidden { display: none !important; }

        /* Auth area */
        .auth-area { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
        .user-name { font-size: 22px; font-weight: 700; line-height: 1.2; }
        .auth-btn {
            background: none; border: none; cursor: pointer;
            font-size: 12px; font-family: 'Urbanist', sans-serif;
            padding: 0;
        }
        .auth-btn.login  { color: var(--accent-green); }
        .auth-btn.logout { color: var(--accent-red); }
    </style>
</head>
<body>

<div class="wrapper" id="mainWrapper">
    <div class="dashboard" id="dashboardCard">
        <div class="header">
            <div class="auth-area">
                <span class="user-name" id="userDisplay">юзер</span>
                <button id="authActionBtn" class="auth-btn login">Авторизация</button>
            </div>
            <div style="display:flex; align-items:center; gap:10px; background:rgba(0,0,0,0.2); padding:8px 12px; border-radius:12px;">
                <button id="prevMonth" style="background:none; border:none; color:white; cursor:pointer;">←</button>
                <span id="monthYear">...</span>
                <button id="nextMonth" style="background:none; border:none; color:white; cursor:pointer;">→</button>
            </div>
        </div>
        <div class="warn-banner hidden" id="warnBanner">
            ⚠️ Без авторизации прогресс сохраняется только на этом устройстве
        </div>
        <div class="grid" id="calendarGrid"></div>
    </div>

    <div class="side-panel" id="sidePanel">
        <div id="successContent" class="hidden">
            <div style="font-size: 60px; margin-bottom: 10px;">🎉</div>
            <h2 style="margin-bottom: 20px; color: var(--accent-green);">Успешно!</h2>
        </div>

        <div id="fixContent" class="hidden">
            <div style="font-size: 50px; margin-bottom: 20px;">🤔</div>
            <p style="margin-bottom: 25px; color: var(--text-muted); line-height: 1.4;">
                Похоже, ты <b id="panelDate" style="color:white">...</b><br>забыл отметить день лопух
            </p>
            <button class="panel-btn fix-btn" id="fixBtn">Я ВСЕ СДЕЛАЛ!</button>
        </div>
        
        <button class="panel-btn cancel-btn hidden" id="cancelBtn">ОТМЕНИТЬ</button>
        
        <button id="closePanelBtn" style="background:none; border:none; color:var(--text-muted); margin-top:15px; cursor:pointer; text-decoration:underline;">Назад</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBTwHveplqnvmfGhoqfKvtMrhdGG8Hog38",
        authDomain: "calendarpeter-ccb5e.firebaseapp.com",
        projectId: "calendarpeter-ccb5e",
        storageBucket: "calendarpeter-ccb5e.firebasestorage.app",
        messagingSenderId: "941069064655",
        appId: "1:941069064655:web:0af9686c36671cd8f8daba"
    };

    if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db   = firebase.firestore();

        const LS_KEY = 'df_data';
        let activeDate = new Date();
        const realToday = new Date(); realToday.setHours(0,0,0,0);
        const realTodayStr = `${realToday.getFullYear()}-${realToday.getMonth()}-${realToday.getDate()}`;
        let selectedDay = null;

        // ── LocalStorage helpers ──────────────────────────────────
        function lsGet()        { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch { return {}; } }
        function lsSet(k, v)    { const d = lsGet(); if (v === null) delete d[k]; else d[k] = v; localStorage.setItem(LS_KEY, JSON.stringify(d)); }

        // ── Auth-aware data layer ─────────────────────────────────
        async function loadData() {
            let data = {};
            if (auth.currentUser) {
                try { const doc = await db.collection('users').doc(auth.currentUser.uid).get(); if (doc.exists) data = doc.data(); }
                catch(e) { console.error(e); }
            } else {
                data = lsGet();
            }
            render(data);
        }

        async function saveKey(key, value) {
            if (auth.currentUser) {
                const payload = value === null
                    ? { [key]: firebase.firestore.FieldValue.delete() }
                    : { [key]: 'done' };
                await db.collection('users').doc(auth.currentUser.uid).set(payload, { merge: true });
            } else {
                lsSet(key, value);
            }
        }

        // ── UI helpers ────────────────────────────────────────────
        const closeAll = () => {
            document.getElementById('mainWrapper').classList.remove('panel-open');
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
        };

        function updateAuthUI(user) {
            const nameEl = document.getElementById('userDisplay');
            const btnEl  = document.getElementById('authActionBtn');
            const warn   = document.getElementById('warnBanner');
            if (user) {
                nameEl.textContent = user.displayName || 'юзер';
                btnEl.textContent  = 'Выйти';
                btnEl.className    = 'auth-btn logout';
                warn.classList.add('hidden');
            } else {
                nameEl.textContent = 'юзер';
                btnEl.textContent  = 'Авторизация';
                btnEl.className    = 'auth-btn login';
                warn.classList.remove('hidden');
            }
        }

        // ── Render ────────────────────────────────────────────────
        function render(userData) {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const m = activeDate.getMonth(); const y = activeDate.getFullYear();
            const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
            document.getElementById('monthYear').innerText = `${months[m]} ${y}`;

            const daysInMonth = new Date(y, m + 1, 0).getDate();

            for (let i = 1; i <= daysInMonth; i++) {
                const cell    = document.createElement('div');
                const dateKey = `${y}-${m}-${i}`;
                const cellDate = new Date(y, m, i); cellDate.setHours(0,0,0,0);
                cell.className = 'cell'; cell.innerText = i;
                const isToday = dateKey === realTodayStr;

                if (isToday) {
                    cell.classList.add('today-is');
                    cell.classList.add(userData[dateKey] === 'done' ? 'marked' : 'today-unmarked');
                } else if (userData[dateKey] === 'done') cell.classList.add('marked');
                else if (cellDate < realToday)           cell.classList.add('missed');
                else                                     cell.classList.add('inactive');

                cell.onclick = async () => {
                    if (cell.classList.contains('inactive')) return;
                    document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');
                    selectedDay = { key: dateKey, el: cell, isToday };

                    const isMarked       = cell.classList.contains('marked');
                    const fixContent     = document.getElementById('fixContent');
                    const successContent = document.getElementById('successContent');
                    const cancelBtn      = document.getElementById('cancelBtn');
                    [fixContent, successContent, cancelBtn].forEach(el => el.classList.add('hidden'));

                    if (isMarked) {
                        cancelBtn.classList.remove('hidden');
                    } else if (isToday) {
                        await markDone();
                        successContent.classList.remove('hidden');
                    } else {
                        fixContent.classList.remove('hidden');
                        document.getElementById('panelDate').innerText = `${i}-го числа`;
                    }
                    document.getElementById('mainWrapper').classList.add('panel-open');
                };
                grid.appendChild(cell);
            }

            // Pad to 36 cells so grid height stays the same every month
            for (let p = daysInMonth + 1; p <= 36; p++) {
                const ghost = document.createElement('div');
                ghost.className = 'cell';
                ghost.style.cssText = 'opacity:0; pointer-events:none;';
                grid.appendChild(ghost);
            }
        }

        async function markDone() {
            if (!selectedDay) return;
            selectedDay.el.classList.remove('missed', 'today-unmarked');
            selectedDay.el.classList.add('marked');
            await saveKey(selectedDay.key, 'done');
        }

        // ── Button handlers ───────────────────────────────────────
        document.getElementById('closePanelBtn').onclick = closeAll;

        document.getElementById('fixBtn').onclick = async () => {
            await markDone();
            closeAll();
        };

        document.getElementById('cancelBtn').onclick = async () => {
            if (!selectedDay) return;
            selectedDay.el.classList.remove('marked');
            selectedDay.el.classList.add(selectedDay.isToday ? 'today-unmarked' : 'missed');
            const k = selectedDay.key; closeAll();
            await saveKey(k, null);
        };

        document.getElementById('prevMonth').onclick = () => { activeDate.setMonth(activeDate.getMonth() - 1); loadData(); };
        document.getElementById('nextMonth').onclick  = () => { activeDate.setMonth(activeDate.getMonth() + 1); loadData(); };

        document.getElementById('authActionBtn').onclick = () => {
            if (auth.currentUser) auth.signOut();
            else auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        };

        // ── Boot ──────────────────────────────────────────────────
        auth.onAuthStateChanged(user => { updateAuthUI(user); loadData(); });
        render(lsGet()); // instant first paint without waiting for Firebase
    }
</script>
</body>
</html>
