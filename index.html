<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discipline Pro Cloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --border: #334155;
            --selected-border: #ffd700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Urbanist', sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow-x: hidden;
        }

        /* Экран входа */
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #loginBtn {
            background: var(--accent-blue); color: white; border: none;
            padding: 18px 40px; font-size: 20px; font-weight: 700;
            border-radius: 16px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }
        #loginBtn:hover { transform: translateY(-3px); filter: brightness(1.1); }

        /* Контейнер приложения */
        .wrapper {
            display: flex; align-items: center; justify-content: center;
            width: 100%; max-width: 1200px;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            padding: 20px;
        }

        .wrapper.panel-open { gap: 30px; }

        .dashboard {
            flex: 0 1 800px; background: var(--card-bg);
            padding: 40px; border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .nav-group { display: flex; align-items: center; gap: 20px; background: rgba(0,0,0,0.2); padding: 10px 20px; border-radius: 12px; border: 1px solid var(--border); }
        .nav-btn { background: transparent; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; }

        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }

        .cell {
            aspect-ratio: 1 / 0.85; background: rgba(255,255,255,0.03);
            border: 2px solid var(--border); border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 700; cursor: pointer; transition: 0.3s;
        }

        .cell.selected { border-color: var(--selected-border); transform: scale(1.05); }
        .cell.today { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }
        .cell.marked { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border-color: var(--accent-green); }
        .cell.missed { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border-color: var(--accent-red); }
        .cell.future { opacity: 0.3; cursor: default; }

        .side-panel {
            width: 0; opacity: 0; overflow: hidden;
            background: var(--card-bg); border-radius: 24px;
            border: 1px solid var(--border); transition: all 0.5s ease;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center;
        }

        .wrapper.panel-open .side-panel { width: 320px; padding: 30px; opacity: 1; }
        
        .fix-btn {
            background: var(--accent-green); color: white; border: none;
            padding: 18px 30px; border-radius: 14px; font-weight: 700;
            cursor: pointer; width: 100%; transition: 0.2s;
        }
        .fix-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="authScreen" class="auth-overlay">
    <h1 style="margin-bottom: 30px; font-size: 48px; letter-spacing: -2px;">Дисциплина</h1>
    <button id="loginBtn">Войти через Google</button>
</div>

<div class="wrapper hidden" id="mainWrapper">
    <div class="dashboard">
        <div class="header">
            <div>
                <h1 id="userTitle" style="font-size: 28px;">Загрузка...</h1>
                <p id="logoutBtn" style="color: var(--text-muted); cursor: pointer; font-size: 12px; margin-top: 5px;">Выйти из аккаунта</p>
            </div>
            <div class="nav-group">
                <button class="nav-btn" id="prevMonth">←</button>
                <h2 id="monthYear" style="min-width: 120px; text-align: center;">...</h2>
                <button class="nav-btn" id="nextMonth">→</button>
            </div>
        </div>

        <div class="grid" id="calendarGrid"></div>
    </div>

    <div class="side-panel" id="sidePanel">
        <div style="font-size: 40px; margin-bottom: 20px;">🤔</div>
        <div style="color: var(--text-muted); line-height: 1.5; margin-bottom: 30px;">
            Похоже, ты <b id="panelDate">4-го числа</b><br>
            забыл отметить день, лопух
        </div>
        <button class="fix-btn" id="fixBtn">Я ВСЕ СДЕЛАЛ!</button>
    </div>
</div>

<script>
    // Твои данные Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBTwHveplqnvmfGhoqfKvtMrhdGG8Hog38",
        authDomain: "calendarpeter-ccb5e.firebaseapp.com",
        projectId: "calendarpeter-ccb5e",
        storageBucket: "calendarpeter-ccb5e.firebasestorage.app",
        messagingSenderId: "941069064655",
        appId: "1:941069064655:web:0af9686c36671cd8f8daba"
    };

    // Инициализация Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const provider = new firebase.auth.GoogleAuthProvider();

    const wrapper = document.getElementById('mainWrapper');
    const authScreen = document.getElementById('authScreen');
    const grid = document.getElementById('calendarGrid');
    const monthYear = document.getElementById('monthYear');
    
    let activeDate = new Date();
    const realToday = new Date();
    const realTodayStr = `${realToday.getFullYear()}-${realToday.getMonth()}-${realToday.getDate()}`;
    let selectedDay = null;

    // Вход / Выход
    document.getElementById('loginBtn').onclick = () => auth.signInWithPopup(provider);
    document.getElementById('logoutBtn').onclick = () => auth.signOut();

    // Следим за состоянием пользователя
    auth.onAuthStateChanged(user => {
        if (user) {
            authScreen.classList.add('hidden');
            wrapper.classList.remove('hidden');
            document.getElementById('userTitle').innerText = user.displayName;
            loadDataAndRender();
        } else {
            authScreen.classList.remove('hidden');
            wrapper.classList.add('hidden');
        }
    });

    async function loadDataAndRender() {
        const user = auth.currentUser;
        if (!user) return;
        
        const doc = await db.collection('users').doc(user.uid).get();
        const userData = doc.exists ? doc.data() : {};
        render(userData);
    }

    function render(userData) {
        grid.innerHTML = '';
        wrapper.classList.remove('panel-open');
        
        const m = activeDate.getMonth();
        const y = activeDate.getFullYear();
        const names = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        monthYear.innerText = `${names[m]} ${y}`;

        const daysInMonth = new Date(y, m + 1, 0).getDate();

        for (let i = 1; i <= daysInMonth; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = i;
            
            const dateKey = `${y}-${m}-${i}`;
            const cellDate = new Date(y, m, i);

            if (dateKey === realTodayStr) {
                cell.classList.add('today');
            } else if (cellDate < realToday) {
                if (userData[dateKey] === 'done') cell.classList.add('marked');
                else cell.classList.add('missed');
            } else {
                cell.classList.add('future');
            }

            cell.onclick = () => {
                if (cell.classList.contains('missed')) {
                    document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');
                    selectedDay = { key: dateKey, el: cell };
                    document.getElementById('panelDate').innerText = `${i}-го числа`;
                    wrapper.classList.add('panel-open');
                } else {
                    wrapper.classList.remove('panel-open');
                    document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                }
            };
            grid.appendChild(cell);
        }
    }

    document.getElementById('fixBtn').onclick = async () => {
        if (selectedDay) {
            const user = auth.currentUser;
            await db.collection('users').doc(user.uid).set({
                [selectedDay.key]: 'done'
            }, { merge: true });
            loadDataAndRender();
        }
    };

    document.getElementById('prevMonth').onclick = () => { activeDate.setMonth(activeDate.getMonth() - 1); loadDataAndRender(); };
    document.getElementById('nextMonth').onclick = () => { activeDate.setMonth(activeDate.getMonth() + 1); loadDataAndRender(); };

</script>
</body>
</html>
