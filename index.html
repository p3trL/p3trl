<div class="side-panel" id="sidePanel">
    <div id="successContent" class="hidden">
        <div style="font-size: 60px; margin-bottom: 10px;">🎉</div>
        <h2 style="margin-bottom: 20px; color: var(--accent-green);">Успешно!</h2>
    </div>

    <div id="fixContent" class="hidden">
        <div id="panelEmoji" style="font-size: 50px; margin-bottom: 20px;">🤔</div>
        <p style="margin-bottom: 25px; color: var(--text-muted); line-height: 1.4;">
            Похоже, ты <b id="panelDate" style="color:white">...</b><br>забыл отметить день лопух
        </p>
        <button class="panel-btn fix-btn" id="fixBtn">Я ВСЕ СДЕЛАЛ!</button>
    </div>
    
    <button class="panel-btn cancel-btn hidden" id="cancelBtn">ОТМЕНИТЬ</button>
    
    <button id="closePanelBtn" style="background:none; border:none; color:var(--text-muted); margin-top:15px; cursor:pointer; text-decoration:underline;">Назад</button>
</div>

<script>
    // ... (конфиг Firebase остается прежним)

    auth.onAuthStateChanged(user => {
        const userDisplay = document.getElementById('userDisplay');
        const authBtn = document.getElementById('authActionBtn');
        
        if (user) {
            userDisplay.innerText = user.displayName;
            authBtn.innerText = "Выйти из аккаунта";
        } else {
            userDisplay.innerText = ""; // Скрываем имя, если не залогинен
            authBtn.innerText = "Авторизация";
        }
        loadData();
    });

    function render(userData) {
        // ... (логика отрисовки сетки)
        
        cell.onclick = async () => {
            if (cell.classList.contains('inactive')) return;
            
            selectedDay = { key: dateKey, el: cell, isToday: isToday };
            const isMarked = cell.classList.contains('marked');
            
            // Сброс панелей
            successContent.classList.add('hidden');
            fixContent.classList.add('hidden');
            cancelBtn.classList.add('hidden');

            if (isMarked) {
                // Если уже отмечено (зеленое) -> Показываем только ОТМЕНИТЬ
                cancelBtn.classList.remove('hidden');
            } else {
                if (isToday) {
                    // ЕСЛИ СЕГОДНЯ -> Сразу отмечаем и показываем УСПЕХ 🎉
                    await markDone();
                    successContent.classList.remove('hidden');
                } else {
                    // ЕСЛИ ПРОШЛОЕ -> Текст про лопуха и кнопка исправления
                    fixContent.classList.remove('hidden');
                    document.getElementById('panelDate').innerText = `${i}-го числа`;
                }
            }
            document.getElementById('mainWrapper').classList.add('panel-open');
        };
    }

    // Обработка кнопки авторизации/выхода
    document.getElementById('authActionBtn').onclick = () => {
        if (auth.currentUser) {
            auth.signOut();
        } else {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        }
    };
</script>
