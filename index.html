<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер Дисциплины</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --calendar-bg: #ffffff;
            --text-color: #333;
            --border-color: #ddd;
            --primary-color: #007bff;
            --success-color: #2ecc71; /* Светло-зеленый, как на рисунке */
            --fail-color: #e74c3c;    /* Красный для пропусков */
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .header-container { text-align: center; margin-bottom: 20px; }
        .calendar-title { font-size: 2rem; margin: 0 0 10px 0; color: var(--primary-color); }
        .calendar-controls { display: flex; gap: 10px; justify-content: center; align-items: center; }
        .calendar-controls button { background: var(--primary-color); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .calendar-controls button:hover { opacity: 0.8; }
        
        /* Сетка как на рисунке, 4 колонки в ряд (можно менять) */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 колонки по умолчанию */
            gap: 15px;
            width: 100%;
            max-width: 600px; /* Ограничим ширину */
            padding: 10px;
        }

        /* Адаптивность для мобильных */
        @media (max-width: 500px) {
            .calendar-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
        }

        .day-cell {
            background: var(--calendar-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px; /* Скругление */
            aspect-ratio: 1 / 0.8; /* Соотношение как на рисунке */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            position: relative;
        }

        /* Состояния ячеек */
        
        /* 1. По умолчанию */
        .day-cell:not(.empty):hover { border-color: var(--primary-color); transform: scale(1.03); }

        /* 2. Сегодня (как день №12 на рисунке) */
        .day-cell.today { background-color: var(--success-color); color: white; border-color: #27ae60; }

        /* 3. Отмеченный прошедший день */
        .day-cell.marked { background-color: #a9dfbf; color: #196f3d; border-color: #196f3d; }

        /* 4. Пропущенный прошедший день (Авто-красный) */
        .day-cell.missed { background-color: var(--fail-color); color: white; border-color: #c0392b; }

        .day-cell.empty { background: transparent; border: none; cursor: default; }

    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="calendar-title">Дисциплина</h1>
        <div class="calendar-controls">
            <button id="prevMonth">&lt; Пр.</button>
            <h2 id="monthYear"></h2>
            <button id="nextMonth">Сл. &gt;</button>
        </div>
    </div>

    <div id="calendarGrid" class="calendar-grid">
        </div>

    <script>
        const monthYearEl = document.getElementById('monthYear');
        const gridEl = document.getElementById('calendarGrid');
        
        // Получаем сегодняшнюю дату для сравнения
        const realToday = new Date();
        const realTodayStr = `${realToday.getFullYear()}-${realToday.getMonth()}-${realToday.getDate()}`;

        // Переменная для навигации по месяцам
        let currentDate = new Date();

        // Уникальный ключ для localStorage
        const STORAGE_KEY = 'discipline_marks_v1';

        // Загрузка отметок из памяти браузера
        function loadMarks() {
            const saved = localStorage.getItem(STORAGE_KEY);
            return saved ? JSON.parse(saved) : {};
        }

        // Сохранение отметок в память
        function saveMark(dateKey, status) {
            let marks = loadMarks();
            marks[dateKey] = status; // status: 'marked'
            localStorage.setItem(STORAGE_KEY, JSON.stringify(marks));
        }

        function renderCalendar() {
            gridEl.innerHTML = "";
            const month = currentDate.getMonth();
            const year = currentDate.getFullYear();
            
            // Название месяца и год
            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            monthYearEl.innerText = `${monthNames[month]} ${year}`;

            // Параметры месяца
            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Начинаем с Пн
            const lastDay = new Date(year, month + 1, 0).getDate(); // 28, 30 или 31
            
            // Загружаем отметки
            const marks = loadMarks();

            // Создаем ячейки
            for (let i = 1; i <= lastDay; i++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day-cell');
                dayCell.innerText = i;
                
                // Создаем уникальный ключ для этой даты (ГГГГ-ММ-ДД)
                const dateKey = `${year}-${month}-${i}`;
                const thisCellDate = new Date(year, month, i);

                // ЛОГИКА СТАТУСОВ:

                // 1. Если это СЕГОДНЯ (как на рисунке день №12)
                if (dateKey === realTodayStr) {
                    dayCell.classList.add('today');
                }
                
                // 2. Если этот день уже в прошлом
                else if (thisCellDate < realToday) {
                    // А. Если пользователь его отметил (кликнул раньше)
                    if (marks[dateKey] === 'marked') {
                        dayCell.classList.add('marked');
                    }
                    // Б. Если день прошел, но не отмечен -> АВТОМАТИЧЕСКИ КРАСНЫЙ
                    else {
                        dayCell.classList.add('missed');
                    }
                }

                // Обработка клика
                dayCell.addEventListener('click', () => {
                    // Можно отмечать только сегодняшний или прошедшие дни
                    if (thisCellDate <= realToday && dateKey !== realTodayStr) {
                        // Если уже отмечен — ничего не делаем, или можно добавить снятие отметки
                        if (!dayCell.classList.contains('marked')) {
                            dayCell.classList.remove('missed');
                            dayCell.classList.add('marked');
                            saveMark(dateKey, 'marked');
                        }
                    } else if (dateKey === realTodayStr) {
                        alert("Сегодняшний день уже отмечен зеленым автоматически!");
                    }
                });

                gridEl.appendChild(dayCell);
            }
        }

        // Кнопки навигации
        document.getElementById('prevMonth').onclick = () => { 
            currentDate.setMonth(currentDate.getMonth() - 1); 
            renderCalendar(); 
        };
        document.getElementById('nextMonth').onclick = () => { 
            currentDate.setMonth(currentDate.getMonth() + 1); 
            renderCalendar(); 
        };

        // Первый запуск
        renderCalendar();
    </script>
</body>
</html>
