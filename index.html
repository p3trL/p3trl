<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discipline Flow</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --accent-green: #22c55e;
            --today-bright: #4ade80; --accent-red: #ef4444; 
            --border: #334155; --selected-border: #ffd700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Urbanist', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); color: var(--text-main); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; width: 100vw; overflow-x: hidden;
        }

        .wrapper { 
            display: flex; flex-direction: row; align-items: center; justify-content: center; 
            width: 100%; max-width: 1200px; padding: 20px; transition: gap 0.4s ease; 
        }
        
        .wrapper.panel-open { gap: 30px; }

        .dashboard { 
            flex: 0 1 750px; background: var(--card-bg); padding: 40px; border-radius: 24px; 
            border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
            position: relative; z-index: 5; transition: filter 0.3s ease;
        }

        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }

        .cell { 
            aspect-ratio: 1 / 0.85; background: rgba(255,255,255,0.03); 
            border: 2px solid var(--border); border-radius: 16px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; font-weight: 700; cursor: pointer; transition: 0.2s; 
        }

        .cell.marked { background: rgba(34, 197, 94, 0.2) !important; color: var(--accent-green) !important; border-color: var(--accent-green) !important; }
        .cell.today-is { border-color: #ffffff !important; border-width: 3px; }
        .cell.today-unmarked { background: var(--today-bright) !important; color: #0f172a !important; }
        .cell.missed { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border-color: var(--accent-red); }
        .cell.inactive { opacity: 0.3; cursor: default; pointer-events: none; }
        .cell.selected { border-color: var(--selected-border) !important; border-width: 4px !important; transform: scale(1.05); }

        /* ПАНЕЛЬ */
        .side-panel { 
            background: var(--card-bg); border-radius: 24px; border: 1px solid var(--border); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Десктоп: окно справа */
        @media (min-width: 769px) {
            .side-panel { flex: 0 0 0; width: 0; opacity: 0; overflow: hidden; z-index: 10; }
            .wrapper.panel-open .side-panel { flex: 0 0 320px; width: 320px; padding: 30px; opacity: 1; }
        }

        /* Телефон: окно по центру + блюр фона */
        @media (max-width: 768px) {
            .wrapper { flex-direction: column; }
            .wrapper.panel-open .dashboard { filter: blur(10px) brightness(0.5); pointer-events: none; }

            .side-panel {
                position: fixed; top: 50%; left: 50%; 
                transform: translate(-50%, -50%) scale(0.8);
                width: 85%; max-width: 340px; padding: 40px 20px;
                opacity: 0; pointer-events: none; z-index: 100;
                box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            }

            .wrapper.panel-open .side-panel { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
            .grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
            .dashboard { padding: 25px; width: 100%; }
            .cell { font-size: 20px; }
        }
