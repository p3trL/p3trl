<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discipline Flow</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --accent-green: #22c55e;
            --today-bright: #4ade80; --accent-red: #ef4444; 
            --border: #334155; --selected-border: #ffd700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Urbanist', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); color: var(--text-main); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; width: 100vw; overflow-x: hidden;
        }

        .wrapper { 
            display: flex; flex-direction: row; align-items: center; justify-content: center; 
            width: 100%; max-width: 1200px; padding: 20px; transition: gap 0.4s ease; 
            position: relative;
        }
        
        .wrapper.panel-open { gap: 30px; }

        .dashboard { 
            flex: 0 1 750px; background: var(--card-bg); padding: 40px; border-radius: 24px; 
            border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
            position: relative; z-index: 5; transition: filter 0.3s ease, opacity 0.3s ease;
        }

        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }

        .cell { 
            aspect-ratio: 1 / 0.85; background: rgba(255,255,255,0.03); 
            border: 2px solid var(--border); border-radius: 16px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; font-weight: 700; cursor: pointer; transition: 0.2s; 
        }

        /* Статусы ячеек */
        .cell.marked { background: rgba(34, 197, 94, 0.2) !important; color: var(--accent-green) !important; border-color: var(--accent-green) !important; }
        .cell.today-is { border-color: #ffffff !important; border-width: 3px; }
        .cell.today-unmarked { background: var(--today-bright) !important; color: #0f172a !important; }
        .cell.missed { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border-color: var(--accent-red); }
        .cell.inactive { opacity: 0.3; cursor: default; pointer-events: none; }
        .cell.selected { border-color: var(--selected-border) !important; border-width: 4px !important; transform: scale(1.05); }

        /* ПАНЕЛЬ */
        .side-panel { 
            background: var(--card-bg); border-radius: 24px; border: 1px solid var(--border); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        /* Десктоп: справа */
        @media (min-width: 769px) {
            .side-panel { flex: 0 0 0; width: 0; opacity: 0; overflow: hidden; z-index: 10; }
            .wrapper.panel-open .side-panel { flex: 0 0 320px; width: 320px; padding: 30px; opacity: 1; }
        }

        /* Мобилка: по центру с размытием */
        @media (max-width: 768px) {
            .wrapper { flex-direction: column; }
            
            .wrapper.panel-open .dashboard {
                filter: blur(8px) brightness(0.6);
                pointer-events: none;
            }

            .side-panel {
                position: fixed; 
                top: 50%; left: 50%; 
                transform: translate(-50%, -50%) scale(0.8);
                width: 85% !important; 
                max-width: 340px;
                height: auto;
                padding: 40px 25px;
                opacity: 0;
                pointer-events: none;
                z-index: 100;
                background: #1e293b;
                border: 1px solid rgba(255,255,255,0.1);
            }

            .wrapper.panel-open .side-panel {
                opacity: 1; 
                pointer-events: auto;
                transform: translate(-50%, -50%) scale(1);
            }

            .grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
            .dashboard { padding: 25px; min-height: 400px; width: 100%; }
            .cell { font-size: 20px; }
        }

        .panel-btn { color: white; border: none; padding: 18px 30px; border-radius: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 10px; transition: 0.2s; }
        .panel-btn:active { transform: scale(0.96); }
        .fix-btn { background: var(--accent-green); }
        .cancel-btn { background: var(--accent-red); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="wrapper" id="mainWrapper">
    <div class="dashboard" id="dashboardCard">
        <div class="header">
            <div>
                <h1 id="userDisplay">Загрузка...</h1>
                <button id="authActionBtn" style="background:none; border:none; color:var(--text-muted); font-size:12px; cursor:pointer;">Авторизация</button>
            </div>
            <div style="display:flex; align-items:center; gap:10px; background:rgba(0,0,0,0.2); padding:8px 12px; border-radius:12px;">
                <button id="prevMonth" style="background:none; border:none; color:white; cursor:pointer; padding: 5px;">←</button>
                <span id="monthYear" style="font-size: 14px; font-weight: 600; min-width: 100px; text-align: center;">...</span>
                <button id="nextMonth" style="background:none; border:none; color:white; cursor:pointer; padding: 5px;">→</button>
            </div>
        </div>
        <div class="grid" id="calendarGrid"></div>
    </div>

    <div class="side-panel" id="sidePanel">
        <div id="panelEmoji" style="font-size: 50px; margin-bottom: 20px;">🤔</div>
        <p id="panelDescription" style="margin-bottom: 25px; color: var(--text-muted); line-height: 1.4; font-size: 16px;">
            Похоже, ты <b id="panelDate" style="color:white">...</b><br>забыл отметить день
        </p>
        <button class="panel-btn fix-btn hidden" id="fixBtn">Я ВСЕ СДЕЛАЛ!</button>
        <button class="panel-btn cancel-btn hidden" id="cancelBtn">ОТМЕНИТЬ НАЖАТИЕ</button>
        <button id="closePanelBtn" style="background:none; border:none; color:var(--text-muted); margin-top:15px; cursor:pointer; text-decoration:underline; font-size: 14px;">Назад</button>
    </div>
</div>

<script>
    // Инициализация Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBTwHveplqnvmfGhoqfKvtMrhdGG8Hog38",
        authDomain: "calendarpeter-ccb5e.firebaseapp.com",
        projectId: "calendarpeter-ccb5e",
        storageBucket: "calendarpeter-ccb5e.firebasestorage.app",
        messagingSenderId: "941069064655",
        appId: "1:941069064655:web:0af9686c36671cd8f8daba"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    
    const auth = firebase.auth();
    const db = firebase.firestore();
    const provider = new firebase.auth.GoogleAuthProvider();

    let activeDate = new Date();
    const realToday = new Date(); realToday.setHours(0,0,0,0);
    const realTodayStr = `${realToday.getFullYear()}-${realToday.getMonth()}-${realToday.getDate()}`;
    let selectedDay = null;

    const closeAll = () => {
        document.getElementById('mainWrapper').classList.remove('panel-open');
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
    };

    document.getElementById('closePanelBtn').onclick = closeAll;

    document.getElementById('authActionBtn').onclick = () => {
        if (auth.currentUser) {
            auth.signOut();
        } else {
            auth.signInWithPopup(provider).catch(e => console.error("Ошибка входа:", e));
        }
    };

    auth.onAuthStateChanged(user => {
        document.getElementById('userDisplay').innerText = user ? user.displayName : "Юзер";
        document.getElementById('authActionBtn').innerText = user ? "Выйти" : "Авторизация через Google";
        loadData();
    });

    async function loadData() {
        if (auth.currentUser) {
            try {
                const doc = await db.collection('users').doc(auth.currentUser.uid).get();
                render(doc.exists ? doc.data() : {});
            } catch (e) {
                console.error("Ошибка загрузки:", e);
                render({});
            }
        } else {
            render({});
        }
    }

    function render(userData) {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = ''; 
        closeAll();
        
        const m = activeDate.getMonth(); 
        const y = activeDate.getFullYear();
        const months = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        
        document.getElementById('monthYear').innerText = `${months[m]} ${y}`;

        const daysInMonth = new Date(y, m + 1, 0).getDate();

        for (let i = 1; i <= daysInMonth; i++) {
            const cell = document.createElement('div');
            const dateKey = `${y}-${m}-${i}`;
            const cellDate = new Date(y, m, i); cellDate.setHours(0,0,0,0);
            
            cell.className = 'cell'; 
            cell.innerText = i;

            if (dateKey === realTodayStr) {
                cell.classList.add('today-is');
                cell.classList.add(userData[dateKey] === 'done' ? 'marked' : 'today-unmarked');
            } else if (userData[dateKey] === 'done') {
                cell.classList.add('marked');
            } else if (cellDate < realToday) {
                cell.classList.add('missed');
            } else {
                cell.classList.add('inactive');
            }

            cell.onclick = () => {
                if (cell.classList.contains('inactive')) return;
                
                document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                cell.classList.add('selected');
                selectedDay = { key: dateKey, el: cell };
                
                const isMarked = cell.classList.contains('marked');
                document.getElementById('panelEmoji').innerText = isMarked ? "🙄" : "🤔";
                document.getElementById('fixBtn').classList.toggle('hidden', isMarked);
                document.getElementById('cancelBtn').classList.toggle('hidden', !isMarked);
                document.getElementById('panelDate').innerText = (dateKey === realTodayStr) ? "сегодня" : `${i}-го числа`;
