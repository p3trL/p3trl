<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discipline Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Urbanist', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .title-group h1 {
            font-size: 32px;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }

        .title-group p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .nav-group h2 {
            font-size: 18px;
            min-width: 140px;
            text-align: center;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            padding: 0 5px;
        }

        .nav-btn:hover {
            color: var(--accent-blue);
        }

        /* ГЛАВНОЕ ИЗМЕНЕНИЕ: 6 КОЛОНОК */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
            .dashboard { padding: 20px; }
            .header { flex-direction: column; gap: 20px; text-align: center; }
        }

        .cell {
            aspect-ratio: 1 / 0.85;
            background: rgba(255,255,255,0.03);
            border: 2px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .cell:hover:not(.future) {
            border-color: var(--accent-blue);
            transform: translateY(-4px);
            background: rgba(255,255,255,0.07);
        }

        /* Статус: Сегодня */
        .cell.today {
            background: var(--accent-green);
            color: #fff;
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }

        /* Статус: Выполнено */
        .cell.marked {
            background: rgba(34, 197, 94, 0.2);
            color: var(--accent-green);
            border-color: var(--accent-green);
        }

        /* Статус: Пропущено */
        .cell.missed {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        /* Статус: Будущее */
        .cell.future {
            opacity: 0.3;
            cursor: default;
        }

        .footer-info {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: var(--text-muted);
            justify-content: center;
        }

        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }

    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <div class="title-group">
            <h1>Дисциплина</h1>
            <p id="stats">Загрузка статистики...</p>
        </div>
        <div class="nav-group">
            <button class="nav-btn" id="prevMonth">←</button>
            <h2 id="monthYear">Месяц Год</h2>
            <button class="nav-btn" id="nextMonth">→</button>
        </div>
    </div>

    <div class="grid" id="calendarGrid"></div>

    <div class="footer-info">
        <div class="legend-item"><div class="dot" style="background:var(--accent-green)"></div> Сегодня</div>
        <div class="legend-item"><div class="dot" style="background:var(--accent-red)"></div> Пропуск</div>
        <div class="legend-item"><div class="dot" style="background:var(--accent-green); opacity: 0.4;"></div> Выполнено</div>
    </div>
</div>

<script>
    const grid = document.getElementById('calendarGrid');
    const monthYear = document.getElementById('monthYear');
    const stats = document.getElementById('stats');
    
    let activeDate = new Date();
    const realToday = new Date();
    const realTodayStr = `${realToday.getFullYear()}-${realToday.getMonth()}-${realToday.getDate()}`;

    const loadData = () => JSON.parse(localStorage.getItem('habits_v2') || '{}');
    const saveData = (key, val) => {
        const data = loadData();
        data[key] = val;
        localStorage.setItem('habits_v2', JSON.stringify(data));
        updateStats();
    };

    const updateStats = () => {
        const data = loadData();
        const done = Object.values(data).filter(v => v === 'done').length;
        stats.innerText = `Всего выполнено дней: ${done}`;
    };

    function render() {
        grid.innerHTML = '';
        const m = activeDate.getMonth();
        const y = activeDate.getFullYear();
        
        const names = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        monthYear.innerText = `${names[m]} ${y}`;

        const lastDay = new Date(y, m + 1, 0).getDate();
        const data = loadData();

        for (let i = 1; i <= lastDay; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = i;

            const dateKey = `${y}-${m}-${i}`;
            const cellDate = new Date(y, m, i);

            if (dateKey === realTodayStr) {
                cell.classList.add('today');
            } else if (cellDate < realToday) {
                if (data[dateKey] === 'done') {
                    cell.classList.add('marked');
                } else {
                    cell.classList.add('missed');
                }
            } else {
                cell.classList.add('future');
            }

            cell.onclick = () => {
                if (cellDate < realToday && !cell.classList.contains('marked')) {
                    cell.classList.remove('missed');
                    cell.classList.add('marked');
                    saveData(dateKey, 'done');
                }
            };

            grid.appendChild(cell);
        }
    }

    document.getElementById('prevMonth').onclick = () => { activeDate.setMonth(activeDate.getMonth() - 1); render(); };
    document.getElementById('nextMonth').onclick = () => { activeDate.setMonth(activeDate.getMonth() + 1); render(); };

    render();
    updateStats();
</script>

</body>
</html>
